[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-industrial-inspection-agent"
version = "0.1.0"
description = "A portfolio-scale multimodal industrial inspection and fault diagnosis project."
readme = "docs/PROJECT_PLAN.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Project Contributors" }]
dependencies = [
    "faiss-cpu>=1.9,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "numpy>=1.26,<3",
    "openai>=2.46,<3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9",
]

[project.scripts]
inspection-agent = "inspection_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
