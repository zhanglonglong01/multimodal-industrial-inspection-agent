[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-industrial-inspection-agent"
version = "1.0.0"
description = "A portfolio-scale multimodal industrial inspection and fault diagnosis project."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Project Contributors" }]
dependencies = [
    "faiss-cpu>=1.9,<2",
    "fastapi>=0.116,<1",
    "jinja2>=3.1,<4",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "numpy>=1.26,<3",
    "openai>=2.46,<3",
    "pillow>=10.4,<11",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "httpx2>=2.10,<3",
    "mypy>=1.15,<2",
    "pytest>=7.4,<9",
    "ruff>=0.12,<1",
]

[project.scripts]
inspection-agent = "inspection_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inspection_agent = ["templates/**/*.html", "static/*"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: opt-in tests that may call a paid external provider",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
exclude = ["build", "dist", "data"]
